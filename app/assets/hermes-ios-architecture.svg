  <text x="802" y="834" text-anchor="middle" fill="#e8a838" font-family="Inter,-apple-system,sans-serif" font-size="21" font-weight="650">Realtime feedback layer</text>
  <text x="802" y="872" text-anchor="middle" fill="#cbd5e1" font-family="Inter,-apple-system,sans-serif" font-size="15">APNs · Widget · Live Activity · Dynamic Island</text>
  <text x="802" y="758" text-anchor="middle" fill="#e8a838" font-family="ui-monospace,monospace" font-size="13">status events</text>
