  <text x="270" y="440" text-anchor="middle" fill="#cbd5e1" font-family="Inter,-apple-system,sans-serif" font-size="17">Sessions · chat · voice</text>
  <text x="270" y="478" text-anchor="middle" fill="#cbd5e1" font-family="Inter,-apple-system,sans-serif" font-size="17">Approvals · Inbox</text>
  <text x="270" y="516" text-anchor="middle" fill="#cbd5e1" font-family="Inter,-apple-system,sans-serif" font-size="17">Share · Widget · Live Activity</text>
  <rect x="166" y="566" width="208" height="48" rx="24" fill="#fb7185" fill-opacity=".12" stroke="#fb7185"/>
  <text x="270" y="596" text-anchor="middle" fill="#fb7185" font-family="Inter,-apple-system,sans-serif" font-size="15">Face ID for high-risk actions</text>
  <text x="270" y="744" text-anchor="middle" fill="#64748b" font-family="Inter,-apple-system,sans-serif" font-size="14">Mobile input + system integration</text>

  <rect x="675" y="304" width="255" height="352" rx="18" fill="#11100c" stroke="#e8a838" stroke-width="2"/>
  <text x="802" y="374" text-anchor="middle" fill="#e8a838" font-family="Inter,-apple-system,sans-serif" font-size="25" font-weight="650">Tailscale HTTPS</text>
  <text x="802" y="420" text-anchor="middle" fill="#d4d4d8" font-family="Inter,-apple-system,sans-serif" font-size="16">Private network boundary</text>
  <text x="802" y="468" text-anchor="middle" fill="#94a3b8" font-family="Inter,-apple-system,sans-serif" font-size="15">Per-instance identity</text>
  <text x="802" y="502" text-anchor="middle" fill="#94a3b8" font-family="Inter,-apple-system,sans-serif" font-size="15">No public Gateway exposure</text>
  <text x="802" y="536" text-anchor="middle" fill="#94a3b8" font-family="Inter,-apple-system,sans-serif" font-size="15">Mac and VPS remain isolated</text>
  <text x="548" y="454" text-anchor="middle" fill="#22d3ee" font-family="ui-monospace,monospace" font-size="13">requests</text>

  <rect x="1165" y="254" width="325" height="520" rx="22" fill="#071711" stroke="#34d399" stroke-width="2"/>
  <text x="1328" y="320" text-anchor="middle" fill="#34d399" font-family="Inter,-apple-system,sans-serif" font-size="26" font-weight="650">Hermes Gateway</text>
