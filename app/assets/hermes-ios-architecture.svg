  <text x="1328" y="441" text-anchor="middle" fill="#94a3b8" font-family="Inter,-apple-system,sans-serif" font-size="14">local agent runtime</text>
  <rect x="1203" y="496" width="249" height="102" rx="12" fill="#0f172a" stroke="#34d399" stroke-opacity=".45"/>
  <text x="1328" y="539" text-anchor="middle" fill="#f1f5f9" font-family="Inter,-apple-system,sans-serif" font-size="19">VPS instance</text>
  <text x="1328" y="571" text-anchor="middle" fill="#94a3b8" font-family="Inter,-apple-system,sans-serif" font-size="14">independent agent runtime</text>
  <text x="1048" y="415" text-anchor="middle" fill="#34d399" font-family="ui-monospace,monospace" font-size="13">HTTPS</text>
  <text x="1048" y="527" text-anchor="middle" fill="#e8a838" font-family="ui-monospace,monospace" font-size="13">SSE</text>
  <text x="1328" y="710" text-anchor="middle" fill="#64748b" font-family="Inter,-apple-system,sans-serif" font-size="14">Gateway remains the source of truth</text>

