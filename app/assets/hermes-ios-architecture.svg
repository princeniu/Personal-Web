<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#050508"/><stop offset="1" stop-color="#0b0f11"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".5"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#22d3ee"/></marker>
    <marker id="arrowGold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#e8a838"/></marker>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/><rect width="1600" height="1000" fill="url(#grid)"/>
  <text x="110" y="112" fill="#f7f7f7" font-family="Inter,-apple-system,sans-serif" font-size="42" font-weight="650">The phone is a control surface, not the runtime.</text>
  <text x="110" y="154" fill="#94a3b8" font-family="Inter,-apple-system,sans-serif" font-size="18">One source of truth, several feedback paths, explicit trust boundaries.</text>

  <path d="M430 475H675" stroke="#22d3ee" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M930 435H1165" stroke="#34d399" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1165 545H930" stroke="#e8a838" stroke-width="3" marker-end="url(#arrowGold)"/>
  <path d="M802 655V790" stroke="#e8a838" stroke-width="3" marker-end="url(#arrowGold)"/>

  <rect x="110" y="278" width="320" height="420" rx="38" fill="#07131a" stroke="#22d3ee" stroke-width="2"/>
  <rect x="137" y="335" width="266" height="306" rx="20" fill="#0f172a" stroke="#1e3a46"/>
