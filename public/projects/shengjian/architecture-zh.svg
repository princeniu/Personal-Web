<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="1600" height="1000" rx="24" fill="#f5f3ed"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#cc6338"/></marker></defs><g font-family="Arial, PingFang SC, sans-serif" fill="#242823"><text x="64" y="65" font-size="22" fill="#d46936" font-weight="600">声间 / SHENGJIAN</text><text x="64" y="139" font-size="49" fill="#242823" font-weight="600">一次采集，三条不同职责的链路</text><text x="64" y="190" font-size="23" fill="#65705f" font-weight="400">实现结构图 · 区分实时显示、持久保存与云端恢复</text><rect x="64" y="282" width="385" height="218" rx="18" fill="#fff" stroke="#d6d8cd"/><text x="88" y="325" font-size="28" fill="#242823" font-weight="600">浏览器</text><text x="88" y="369" font-size="21" fill="#65705f" font-weight="400">麦克风 → AudioWorklet</text><text x="88" y="402" font-size="21" fill="#65705f" font-weight="400">16 kHz 单声道 PCM</text><text x="88" y="435" font-size="21" fill="#65705f" font-weight="400">字幕 / WAV 分段双路径</text><rect x="575" y="250" width="416" height="188" rx="18" fill="#fff" stroke="#d6d8cd"/><text x="599" y="293" font-size="28" fill="#242823" font-weight="600">Soniox</text><text x="599" y="337" font-size="21" fill="#65705f" font-weight="400">实时音频流</text><text x="599" y="370" font-size="21" fill="#65705f" font-weight="400">原文 + 译文返回浏览器</text><path d="M449 330 L575 330" fill="none" stroke="#cc6338" stroke-width="3" marker-end="url(#arrow)"/><text x="462" y="310" font-size="18" fill="#cc6338" font-weight="400">实时</text><rect x="575" y="515" width="416" height="245" rx="18" fill="#fff" stroke="#d6d8cd"/><text x="599" y="558" font-size="28" fill="#242823" font-weight="600">Node.js 服务</text><text x="599" y="602" font-size="21" fill="#65705f" font-weight="400">序号 / 采样偏移 / SHA-256</text><text x="599" y="635" font-size="21" fill="#65705f" font-weight="400">分段与元数据持久写入</text><text x="599" y="668" font-size="21" fill="#65705f" font-weight="400">转录事件与摘要任务</text><text x="599" y="701" font-size="21" fill="#65705f" font-weight="400">按账号检查录音归属</text><path d="M300 500 L300 626" fill="none" stroke="#cc6338" stroke-width="3" marker-end="url(#arrow)"/><path d="M300 626 L575 626" fill="none" stroke="#cc6338" stroke-width="3" marker-end="url(#arrow)"/><text x="322" y="605" font-size="20" fill="#cc6338" font-weight="400">WAV + 字幕事件</text><rect x="1115" y="260" width="420" height="178" rx="18" fill="#fff" stroke="#d6d8cd"/><text x="1139" y="303" font-size="28" fill="#242823" font-weight="600">OpenAI</text><text x="1139" y="347" font-size="21" fill="#65705f" font-weight="400">手动请求，仅发送原文</text><text x="1139" y="380" font-size="21" fill="#65705f" font-weight="400">结构化学习笔记</text><path d="M991 567 L1050 567" fill="none" stroke="#cc6338" stroke-width="3" marker-end="url(#arrow)"/><path d="M1050 567 L1050 350" fill="none" stroke="#cc6338" stroke-width="3" marker-end="url(#arrow)"/><path d="M1050 350 L1115 350" fill="none" stroke="#cc6338" stroke-width="3" marker-end="url(#arrow)"/><rect x="1115" y="515" width="420" height="245" rx="18" fill="#fff" stroke="#d6d8cd"/><text x="1139" y="558" font-size="28" fill="#242823" font-weight="600">Supabase 私有存储</text><text x="1139" y="602" font-size="21" fill="#65705f" font-weight="400">独立归档队列</text><text x="1139" y="635" font-size="21" fill="#65705f" font-weight="400">逐文件回读校验</text><text x="1139" y="668" font-size="21" fill="#65705f" font-weight="400">音频 / 转录 / 摘要归档</text><text x="1139" y="701" font-size="21" fill="#65705f" font-weight="400">恢复检查归属与完整性</text><path d="M991 662 L1115 662" fill="none" stroke="#cc6338" stroke-width="3" marker-end="url(#arrow)"/><text x="64" y="865" font-size="26" fill="#242823" font-weight="400">音频保存不等待转录或云上传；只有归档校验完成才具备云端恢复副本。</text><text x="64" y="913" font-size="22" fill="#65705f" font-weight="400">音频会发送到外部服务；此架构不属于仅本地处理或端到端加密。</text></g></svg>