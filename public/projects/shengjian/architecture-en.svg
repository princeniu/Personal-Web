<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="1600" height="1000" rx="24" fill="#f5f3ed"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#cc6338"/></marker></defs><g font-family="Arial, PingFang SC, sans-serif" fill="#242823"><text x="64" y="65" font-size="22" fill="#d46936" font-weight="600">声间 / SHENGJIAN</text><text x="64" y="139" font-size="49" fill="#242823" font-weight="600">One capture, three independent responsibilities</text><text x="64" y="190" font-size="23" fill="#65705f" font-weight="400">Implementation map · live display, durable saving, and cloud recovery</text><rect x="64" y="282" width="385" height="218" rx="18" fill="#fff" stroke="#d6d8cd"/><text x="88" y="325" font-size="28" fill="#242823" font-weight="600">Browser</text><text x="88" y="369" font-size="21" fill="#65705f" font-weight="400">Microphone → AudioWorklet</text><text x="88" y="402" font-size="21" fill="#65705f" font-weight="400">16 kHz mono PCM</text><text x="88" y="435" font-size="21" fill="#65705f" font-weight="400">Caption and WAV paths</text><rect x="575" y="250" width="416" height="188" rx="18" fill="#fff" stroke="#d6d8cd"/><text x="599" y="293" font-size="28" fill="#242823" font-weight="600">Soniox</text><text x="599" y="337" font-size="21" fill="#65705f" font-weight="400">Live audio stream</text><text x="599" y="370" font-size="21" fill="#65705f" font-weight="400">Original + translated captions</text><path d="M449 330 L575 330" fill="none" stroke="#cc6338" stroke-width="3" marker-end="url(#arrow)"/><text x="462" y="310" font-size="18" fill="#cc6338" font-weight="400">LIVE</text><rect x="575" y="515" width="416" height="245" rx="18" fill="#fff" stroke="#d6d8cd"/><text x="599" y="558" font-size="28" fill="#242823" font-weight="600">Node.js server</text><text x="599" y="602" font-size="21" fill="#65705f" font-weight="400">Sequence / sample offset / hash</text><text x="599" y="635" font-size="21" fill="#65705f" font-weight="400">Durable segment + metadata writes</text><text x="599" y="668" font-size="21" fill="#65705f" font-weight="400">Transcript events + note jobs</text><text x="599" y="701" font-size="21" fill="#65705f" font-weight="400">Recording ownership checks</text><path d="M300 500 L300 626" fill="none" stroke="#cc6338" stroke-width="3" marker-end="url(#arrow)"/><path d="M300 626 L575 626" fill="none" stroke="#cc6338" stroke-width="3" marker-end="url(#arrow)"/><text x="322" y="605" font-size="20" fill="#cc6338" font-weight="400">WAV + caption events</text><rect x="1115" y="260" width="420" height="178" rx="18" fill="#fff" stroke="#d6d8cd"/><text x="1139" y="303" font-size="28" fill="#242823" font-weight="600">OpenAI</text><text x="1139" y="347" font-size="21" fill="#65705f" font-weight="400">Manual request; source text only</text><text x="1139" y="380" font-size="21" fill="#65705f" font-weight="400">Structured study notes</text><path d="M991 567 L1050 567" fill="none" stroke="#cc6338" stroke-width="3" marker-end="url(#arrow)"/><path d="M1050 567 L1050 350" fill="none" stroke="#cc6338" stroke-width="3" marker-end="url(#arrow)"/><path d="M1050 350 L1115 350" fill="none" stroke="#cc6338" stroke-width="3" marker-end="url(#arrow)"/><rect x="1115" y="515" width="420" height="245" rx="18" fill="#fff" stroke="#d6d8cd"/><text x="1139" y="558" font-size="28" fill="#242823" font-weight="600">Private Supabase storage</text><text x="1139" y="602" font-size="21" fill="#65705f" font-weight="400">Separate archive queue</text><text x="1139" y="635" font-size="21" fill="#65705f" font-weight="400">Per-file read-back verification</text><text x="1139" y="668" font-size="21" fill="#65705f" font-weight="400">Audio / transcript / note archive</text><text x="1139" y="701" font-size="21" fill="#65705f" font-weight="400">Ownership + integrity on restore</text><path d="M991 662 L1115 662" fill="none" stroke="#cc6338" stroke-width="3" marker-end="url(#arrow)"/><text x="64" y="865" font-size="26" fill="#242823" font-weight="400">Saving does not wait for transcription or cloud upload. Recovery depends on a verified archive.</text><text x="64" y="913" font-size="22" fill="#65705f" font-weight="400">Audio reaches an external provider; this is not local-only processing or end-to-end encryption.</text></g></svg>