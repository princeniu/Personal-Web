<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="1600" height="1000" rx="24" fill="#f5f3ed"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#cc6338"/></marker></defs><g font-family="Arial, PingFang SC, sans-serif" fill="#242823"><text x="64" y="65" font-size="22" fill="#d46936" font-weight="600">声间 / SHENGJIAN</text><text x="64" y="139" font-size="49" fill="#242823" font-weight="600">Three states, three different promises</text><text x="64" y="190" font-size="23" fill="#65705f" font-weight="400">State model · schematic, not a UI screenshot or a new cloud acceptance test</text><text x="64" y="312" font-size="45" fill="#cc6338" font-weight="600">01</text><rect x="163" y="250" width="605" height="170" rx="18" fill="#fff" stroke="#d6d8cd"/><text x="187" y="293" font-size="28" fill="#242823" font-weight="600">Audio saving</text><text x="187" y="337" font-size="21" fill="#65705f" font-weight="400">Capture → segment → write ACK</text><text x="187" y="370" font-size="21" fill="#65705f" font-weight="400">Feedback: acknowledged audio duration</text><path d="M786 337 L870 337" fill="none" stroke="#cc6338" stroke-width="3" marker-end="url(#arrow)"/><rect x="891" y="250" width="643" height="170" rx="18" fill="#fff" stroke="#d6d8cd"/><text x="915" y="293" font-size="28" fill="#242823" font-weight="600">Failure and boundary</text><text x="915" y="337" font-size="21" fill="#65705f" font-weight="400">Queue beyond 30 s: stop capture</text><text x="915" y="370" font-size="21" fill="#65705f" font-weight="400">Protect saved content; expose the failure</text><text x="64" y="519" font-size="45" fill="#cc6338" font-weight="600">02</text><rect x="163" y="457" width="605" height="170" rx="18" fill="#fff" stroke="#d6d8cd"/><text x="187" y="500" font-size="28" fill="#242823" font-weight="600">Transcript completion</text><text x="187" y="544" font-size="21" fill="#65705f" font-weight="400">Connect → receive → finalization</text><text x="187" y="577" font-size="21" fill="#65705f" font-weight="400">Feedback: transcript finished</text><path d="M786 544 L870 544" fill="none" stroke="#cc6338" stroke-width="3" marker-end="url(#arrow)"/><rect x="891" y="457" width="643" height="170" rx="18" fill="#fff" stroke="#d6d8cd"/><text x="915" y="500" font-size="28" fill="#242823" font-weight="600">Failure and boundary</text><text x="915" y="544" font-size="21" fill="#65705f" font-weight="400">Connection failure is separate from saving</text><text x="915" y="577" font-size="21" fill="#65705f" font-weight="400">No automatic translation backfill</text><text x="64" y="726" font-size="45" fill="#cc6338" font-weight="600">03</text><rect x="163" y="664" width="605" height="170" rx="18" fill="#fff" stroke="#d6d8cd"/><text x="187" y="707" font-size="28" fill="#242823" font-weight="600">Cloud archiving</text><text x="187" y="751" font-size="21" fill="#65705f" font-weight="400">Queue → upload → read-back check</text><text x="187" y="784" font-size="21" fill="#65705f" font-weight="400">Feedback: archive complete</text><path d="M786 751 L870 751" fill="none" stroke="#cc6338" stroke-width="3" marker-end="url(#arrow)"/><rect x="891" y="664" width="643" height="170" rx="18" fill="#fff" stroke="#d6d8cd"/><text x="915" y="707" font-size="28" fill="#242823" font-weight="600">Failure and boundary</text><text x="915" y="751" font-size="21" fill="#65705f" font-weight="400">Failure retains server originals</text><text x="915" y="784" font-size="21" fill="#65705f" font-weight="400">Retry available; pending is not backed up</text><text x="64" y="939" font-size="28" fill="#cc6338" font-weight="600">Ending capture ≠ finished transcript ≠ verified cloud backup</text></g></svg>