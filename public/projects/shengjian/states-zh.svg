<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="1600" height="1000" rx="24" fill="#f5f3ed"/><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#cc6338"/></marker></defs><g font-family="Arial, PingFang SC, sans-serif" fill="#242823"><text x="64" y="65" font-size="22" fill="#d46936" font-weight="600">声间 / SHENGJIAN</text><text x="64" y="139" font-size="49" fill="#242823" font-weight="600">三个状态，三个不同的承诺</text><text x="64" y="190" font-size="23" fill="#65705f" font-weight="400">状态模型示意 · 不是产品截图，也不是本次云端验收结果</text><text x="64" y="312" font-size="45" fill="#cc6338" font-weight="600">01</text><rect x="163" y="250" width="605" height="170" rx="18" fill="#fff" stroke="#d6d8cd"/><text x="187" y="293" font-size="28" fill="#242823" font-weight="600">音频保存</text><text x="187" y="337" font-size="21" fill="#65705f" font-weight="400">采集 → 分段 → 写入确认</text><text x="187" y="370" font-size="21" fill="#65705f" font-weight="400">成功反馈：已保存的音频时长</text><path d="M786 337 L870 337" fill="none" stroke="#cc6338" stroke-width="3" marker-end="url(#arrow)"/><rect x="891" y="250" width="643" height="170" rx="18" fill="#fff" stroke="#d6d8cd"/><text x="915" y="293" font-size="28" fill="#242823" font-weight="600">异常与边界</text><text x="915" y="337" font-size="21" fill="#65705f" font-weight="400">队列超过 30 秒：停止采集</text><text x="915" y="370" font-size="21" fill="#65705f" font-weight="400">保护已保存内容，不假装继续成功</text><text x="64" y="519" font-size="45" fill="#cc6338" font-weight="600">02</text><rect x="163" y="457" width="605" height="170" rx="18" fill="#fff" stroke="#d6d8cd"/><text x="187" y="500" font-size="28" fill="#242823" font-weight="600">转录收尾</text><text x="187" y="544" font-size="21" fill="#65705f" font-weight="400">连接 → 接收 → 引擎收尾</text><text x="187" y="577" font-size="21" fill="#65705f" font-weight="400">成功反馈：文字已结束</text><path d="M786 544 L870 544" fill="none" stroke="#cc6338" stroke-width="3" marker-end="url(#arrow)"/><rect x="891" y="457" width="643" height="170" rx="18" fill="#fff" stroke="#d6d8cd"/><text x="915" y="500" font-size="28" fill="#242823" font-weight="600">异常与边界</text><text x="915" y="544" font-size="21" fill="#65705f" font-weight="400">连接失败与保存状态分开</text><text x="915" y="577" font-size="21" fill="#65705f" font-weight="400">断连期间不会自动补译</text><text x="64" y="726" font-size="45" fill="#cc6338" font-weight="600">03</text><rect x="163" y="664" width="605" height="170" rx="18" fill="#fff" stroke="#d6d8cd"/><text x="187" y="707" font-size="28" fill="#242823" font-weight="600">云端归档</text><text x="187" y="751" font-size="21" fill="#65705f" font-weight="400">排队 → 上传 → 回读校验</text><text x="187" y="784" font-size="21" fill="#65705f" font-weight="400">成功反馈：归档完成</text><path d="M786 751 L870 751" fill="none" stroke="#cc6338" stroke-width="3" marker-end="url(#arrow)"/><rect x="891" y="664" width="643" height="170" rx="18" fill="#fff" stroke="#d6d8cd"/><text x="915" y="707" font-size="28" fill="#242823" font-weight="600">异常与边界</text><text x="915" y="751" font-size="21" fill="#65705f" font-weight="400">失败保留服务器原件</text><text x="915" y="784" font-size="21" fill="#65705f" font-weight="400">可重试；未完成不称为已备份</text><text x="64" y="939" font-size="28" fill="#cc6338" font-weight="600">结束录音 ≠ 转录完成 ≠ 云端备份完成</text></g></svg>